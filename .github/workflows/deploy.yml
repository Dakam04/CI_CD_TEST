name: CI/CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "태그 (예: v1.0.0)"
        required: true
      hotfix:
        description: "hotfix (dev, qa, prod_KR, prod_JP 모두 배포)"
        type: boolean
        default: false

concurrency: deploy

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slots: ${{ steps.slots.outputs.slots }}
      branch_slot: ${{ steps.slots.outputs.branch_slot }}

    steps:
      - name: "CI: 태그 확인"
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::태그를 입력해야 함"
            exit 1
          fi

      - name: "CI: 코드 가져오기"
        uses: actions/checkout@v4

      - name: "CI: 배포 위치 정하기"
        id: slots
        env:
          BRANCH: ${{ github.ref_name }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          if [ "$BRANCH" = main ]; then
            SLOTS="dev"
          elif [ "$BRANCH" = QA ]; then
            SLOTS="qa"
          elif [ "$BRANCH" = KR ]; then
            SLOTS="prod_KR"
          elif [ "$BRANCH" = JP ]; then
            SLOTS="prod_JP"
          else
            echo "::error::유효하지 않은 브랜치"
            exit 1
          fi
          BRANCH_SLOT="$SLOTS"

          if [ "$HOTFIX" = true ]; then
            SLOTS="dev qa prod_KR prod_JP"
          fi

          echo "slots=$SLOTS" >> "$GITHUB_OUTPUT"
          echo "branch_slot=$BRANCH_SLOT" >> "$GITHUB_OUTPUT"

  cicd:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SLOTS: ${{ needs.plan.outputs.slots }}
      BRANCH_SLOT: ${{ needs.plan.outputs.branch_slot }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: "CI: 코드 가져오기"
        uses: actions/checkout@v4

      - name: "CI: 배포 파일 만들기"
        run: |
          BUILD_INFO="$(git rev-parse --short HEAD) / $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          if [ "$SLOTS" != "$BRANCH_SLOT" ]; then
            git fetch --depth 1 origin gh-pages
          fi

          mkdir -p _site
          cp portal.html _site/index.html
          for SLOT in $SLOTS; do
            mkdir -p "_site/$SLOT"
            cp -r app/. "_site/$SLOT/"
            if [ "$SLOT" = "$BRANCH_SLOT" ]; then
              sed -i "s|__SLOT_NAME__|$SLOT|; s|__VERSION__|$TAG|; s|__BUILD_INFO__|$BUILD_INFO|" "_site/$SLOT/index.html"
            else
              git show "origin/gh-pages:$SLOT/index.html" > "_site/$SLOT/index.html"
              sed -i "s|버전: [^<]*|버전: $TAG|; s|빌드: [^<]*|빌드: $BUILD_INFO|" "_site/$SLOT/index.html"
            fi
          done

      - name: "CD: GitHub Pages에 배포"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: "deploy ${{ needs.plan.outputs.slots }} ${{ inputs.tag }}"
