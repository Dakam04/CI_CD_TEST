name: CI/CD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 배포할 브랜치
        type: choice
        options: [main, QA, KR, JP]
      tag:
        description: "태그 (예: v1.0.0)"
        required: true
      hotfix:
        description: "hotfix 모든 브랜치에 배포"
        type: boolean
        default: false

concurrency: deploy

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slots: ${{ steps.slots.outputs.slots }}
      branch_slot: ${{ steps.slots.outputs.branch_slot }}

    steps:
      - name: "CI: 태그 확인"
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::태그를 입력해야 함"
            exit 1
          fi

      - name: "CI: 코드 가져오기"
        uses: actions/checkout@v4

      - name: "CI: 배포 위치 정하기"
        id: slots
        env:
          BRANCH: ${{ inputs.branch }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          if [ "$BRANCH" = main ]; then
            SLOTS="dev"
          elif [ "$BRANCH" = QA ]; then
            SLOTS="qa"
          elif [ "$BRANCH" = KR ]; then
            SLOTS="prod_KR"
          elif [ "$BRANCH" = JP ]; then
            SLOTS="prod_JP"
          else
            echo "::error::유효하지 않은 브랜치"
            exit 1
          fi
          BRANCH_SLOT="$SLOTS"

          if [ "$HOTFIX" = true ]; then
            SLOTS="dev qa prod_KR prod_JP"
          fi

          echo "slots=$SLOTS" >> "$GITHUB_OUTPUT"
          echo "branch_slot=$BRANCH_SLOT" >> "$GITHUB_OUTPUT"

  cicd:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH_SLOT: ${{ needs.plan.outputs.branch_slot }}
      TAG: ${{ inputs.tag }}
      HOTFIX: ${{ inputs.hotfix }}
      BRANCH: ${{ inputs.branch }}

    steps:
      - name: "CI: 코드 가져오기"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: "CI: 배포 파일 만들기"
        run: |
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          BUILD_INFO="$(git rev-parse --short HEAD) / $NOW"
          HOTFIX_INFO="-"
          if [ "$HOTFIX" = true ]; then
            HOTFIX_INFO="$BRANCH / $NOW"
          fi
          echo "HOTFIX_INFO=$HOTFIX_INFO" >> "$GITHUB_ENV"

          mkdir -p _site
          git show origin/main:portal.html > _site/index.html
          mkdir -p "_site/$BRANCH_SLOT"
          cp -r app/. "_site/$BRANCH_SLOT/"
          sed -i "s|__SLOT_NAME__|$BRANCH_SLOT|; s|__VERSION__|$TAG|; s|__BUILD_INFO__|$BUILD_INFO|; s|__HOTFIX_INFO__|$HOTFIX_INFO|" "_site/$BRANCH_SLOT/index.html"

      - name: "hotfix 모든 브랜치에 적용"
        if: inputs.hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(git rev-parse HEAD)

          for TARGET in main QA KR JP; do
            if [ "$TARGET" = main ]; then SLOT=dev
            elif [ "$TARGET" = QA ]; then SLOT=qa
            elif [ "$TARGET" = KR ]; then SLOT=prod_KR
            else SLOT=prod_JP
            fi
            if [ "$TARGET" = "$BRANCH" ]; then
              continue
            fi

            git worktree add -q --detach "_wt/$TARGET" "origin/$TARGET"
            if [ -z "$(git log "origin/$TARGET" --grep="cherry picked from commit $SHA" --format=%h)" ]; then
              if ! git diff "$SHA^" "$SHA" -- app | git -C "_wt/$TARGET" apply --3way --allow-empty; then
                git -C "_wt/$TARGET" reset -q --hard
                echo "::warning::$TARGET 브랜치에 hotfix를 적용하지 못함(충돌). $SLOT 배포를 건너뜀. 직접 반영 필요"
                continue
              fi
              if ! git -C "_wt/$TARGET" diff --cached --quiet; then
                git -C "_wt/$TARGET" commit -q --author="$(git log -1 --format='%an <%ae>' "$SHA")" \
                  -m "$(git log -1 --format=%B "$SHA")" -m "(cherry picked from commit $SHA)"
                git -C "_wt/$TARGET" push origin "HEAD:$TARGET"
              fi
            fi

            mkdir -p "_site/$SLOT"
            cp -r "_wt/$TARGET/app/." "_site/$SLOT/"
            git show "origin/gh-pages:$SLOT/index.html" > "_site/$SLOT/index.html"
            sed -i "s|마지막 핫픽스: [^<]*|마지막 핫픽스: $HOTFIX_INFO|" "_site/$SLOT/index.html"
          done

      - name: "CD: GitHub Pages에 배포"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: "deploy ${{ needs.plan.outputs.slots }} ${{ inputs.tag }}"
