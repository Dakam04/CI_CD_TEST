name: GitHub Pages 배포

on:
  workflow_dispatch:
    inputs:
      target:
        description: 배포 위치
        type: choice
        options: [dev, prod]
      tag:
        required: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.target }}
    steps:
      - name: 태그 입력 확인
        if: inputs.tag == ''
        run: |
          echo "::error::태그를 입력해야 함"
          exit 1

      - uses: actions/checkout@v4

      - name: 배포 파일 구성
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TARGET" = prod ]; then SLOT_NAME="운영"; else SLOT_NAME="dev"; fi
          BUILD_INFO="${GITHUB_SHA::7} / $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          mkdir -p "_site/$TARGET"
          cp portal.html _site/index.html
          sed "s|__SLOT_NAME__|$SLOT_NAME|; s|__VERSION__|$TAG|; s|__BUILD_INFO__|$BUILD_INFO|" index.html > "_site/$TARGET/index.html"

      - name: gh-pages 브랜치에 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
