name: GitHub Pages 배포

on:
  push:
    branches: [ main ]
  workflow_dispatch:            # Actions 탭에서 수동 실행 버튼 활성화

# 동시에 두 번 실행되면 같은 버전 태그를 만들 수 있으므로 한 번에 하나씩 실행
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 커밋 메시지로 다음 버전을 계산한다.
  #   BREAKING CHANGE: → major (1.0.0 → 2.0.0)
  #   feature:         → minor (1.0.0 → 1.1.0)
  #   fix:             → patch (1.0.0 → 1.0.1)
  #   wip:             → 최신 커밋이 wip면 배포하지 않음
  # 직전 버전 태그 이후의 커밋 중 가장 큰 변경 기준으로 한 번만 올린다.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.calc.outputs.release }}
      version: ${{ steps.calc.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 태그와 전체 커밋 이력이 필요

      - name: 버전 계산
        id: calc
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            BASE="${LAST_TAG#v}"
          else
            RANGE="HEAD"
            BASE="0.0.0"
          fi
          echo "직전 버전: ${LAST_TAG:-없음}"

          HEAD_SUBJECT=$(git log -1 --format=%s)
          if [[ "$HEAD_SUBJECT" =~ ^wip[[:space:]]*: ]]; then
            echo "::notice::wip 커밋이라 배포하지 않음 (${HEAD_SUBJECT})"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP=none
          while IFS= read -r -d '' MSG || [ -n "$MSG" ]; do
            SUBJECT="${MSG%%$'\n'*}"
            if grep -Eq '^BREAKING CHANGE[[:space:]]*:' <<< "$MSG"; then
              BUMP=major
              break
            elif [[ "$SUBJECT" =~ ^feature[[:space:]]*: ]]; then
              BUMP=minor
            elif [[ "$SUBJECT" =~ ^fix[[:space:]]*: ]] && [ "$BUMP" = none ]; then
              BUMP=patch
            fi
          done < <(git log -z --format=%B "$RANGE")

          if [ "$BUMP" = none ]; then
            echo "::notice::fix, feature, BREAKING CHANGE 커밋이 없어 배포하지 않음"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "::notice::${BUMP} 변경 → v${VERSION}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write           # 버전 태그 push
      pages: write
      id-token: write
    # 배포 대상 환경. 운영 환경을 만들면 이 이름만 바꾸거나 job을 추가한다.
    environment:
      name: dev
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # 1. 저장소 코드 받기
      - uses: actions/checkout@v4

      # 2. 화면의 __VERSION__, __BUILD_INFO__ 를 버전, 커밋 ID, 배포 시각(일본 시간)으로 교체
      - name: 빌드 정보 기록
        run: |
          BUILD_INFO="${GITHUB_SHA::7} / $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          sed -i "s|__VERSION__|v${VERSION}|; s|__BUILD_INFO__|${BUILD_INFO}|" index.html

      # 3. Pages 설정 확인
      - uses: actions/configure-pages@v5

      # 4. 올릴 파일 묶기 (저장소 루트 전체)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 5. GitHub Pages에 배포
      - id: deployment
        uses: actions/deploy-pages@v4

      # 6. 배포가 성공한 경우에만 버전 태그 기록 (다음 버전 계산의 기준)
      - name: 버전 태그 생성
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"